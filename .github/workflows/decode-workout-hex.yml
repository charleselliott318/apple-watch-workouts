name: Decode WorkoutKit Hex
on:
  push:
    paths:
      - 'staging/*.workout.hex'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode workout
        shell: bash
        run: |
          shopt -s nullglob
          for f in staging/*.workout.hex; do
            name="$(basename "$f" .hex)"
            xxd -r -p "$f" > "workouts/$name"
            rm "$f"
          done
      - name: Commit workout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workouts staging
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Decode WorkoutKit hex file"
          git push
