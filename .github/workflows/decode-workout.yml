name: Decode WorkoutKit payload
on:
  push:
    paths:
      - 'staging/*.workout.b64'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode WorkoutKit file
        shell: bash
        run: |
          shopt -s nullglob
          files=(staging/*.workout.b64)
          if [ ${#files[@]} -eq 0 ]; then
            exit 0
          fi
          for f in "${files[@]}"; do
            name="$(basename "$f" .b64)"
            base64 --decode "$f" > "workouts/$name"
            rm "$f"
          done
      - name: Commit decoded workout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workouts staging
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Decode WorkoutKit file"
          git push
